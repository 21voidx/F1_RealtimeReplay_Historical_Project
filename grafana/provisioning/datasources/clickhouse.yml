apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse-openf1
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      secure: false
      username: default
      defaultDatabase: openf1_replay
      queryTimeout: 60
