version: 2

models:
  - name: fct_openf1__lap_gap_evolution
    description: Lap-level race and sprint gap, interval, position, pit, and sector metrics.
    columns:
      - name: lap_id
        data_tests: [not_null, unique]
  - name: fct_openf1__telemetry_lap_driver
    description: Lap-level telemetry summary by driver.
    columns:
      - name: lap_id
        data_tests: [not_null]
      - name: telemetry_sample_count
        data_tests: [non_negative]
  - name: fct_openf1__tyre_weather_lap_context
    description: Lap-level tyre, stint, weather, and pace context.
    columns:
      - name: lap_id
        data_tests: [not_null]
  - name: fct_openf1__optimal_tyre_life
    description: Best observed tyre age per compound and circuit by average lap time.
