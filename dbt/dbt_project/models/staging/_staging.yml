version: 2

models:
  - name: stg_openf1__car_data
    description: Clean high-frequency OpenF1 telemetry samples.
    columns:
      - name: car_data_id
        data_tests: [not_null, unique]
      - name: telemetry_at
        data_tests: [not_null]
      - name: speed
        data_tests:
          - accepted_range:
              arguments: {min_value: 0, max_value: 430}
      - name: throttle
        data_tests:
          - accepted_range:
              arguments: {min_value: 0, max_value: 110}
      - name: brake
        data_tests:
          - accepted_range:
              arguments: {min_value: 0, max_value: 110}
  - name: stg_openf1__laps
    description: Clean lap and sector timing records.
    columns:
      - name: lap_id
        data_tests: [not_null, unique]
      - name: lap_duration_seconds
        data_tests: [non_negative]
  - name: stg_openf1__pit
    description: Pit lane and stationary pit-stop events. Main pit stop metric uses stop_duration_seconds.
    columns:
      - name: pit_stop_id
        data_tests: [not_null, unique]
      - name: raw_pit_duration_seconds
        data_tests: [non_negative]
      - name: lane_duration_seconds
        data_tests: [non_negative]
      - name: stop_duration_seconds
        data_tests: [non_negative]
      - name: pit_stop_duration_seconds
        data_tests: [non_negative]
  - name: stg_openf1__stints
    description: Tyre stint records with normalized compound.
    columns:
      - name: stint_id
        data_tests: [not_null, unique]
      - name: compound
        data_tests:
          - accepted_values:
              arguments:
                values: ['SOFT', 'MEDIUM', 'HARD', 'INTERMEDIATE', 'WET', 'UNKNOWN', 'TEST_UNKNOWN']
  - name: stg_openf1__sessions
    description: Clean session dimension base.
    columns:
      - name: session_key
        data_tests: [not_null, unique]
