name: f1_formula_local

x-airflow-common: &airflow-common
  build:
    context: ./docker/airflow
  image: f1-airflow:3.0.6-local
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Jakarta
    AIRFLOW__API__BASE_URL: http://localhost:8080
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-formula1_local_secret_key}
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    _AIRFLOW_WWW_USER_CREATE: "true"
    _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-airflow}
    _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
    _AIRFLOW_WWW_USER_FIRSTNAME: Local
    _AIRFLOW_WWW_USER_LASTNAME: Admin
    _AIRFLOW_WWW_USER_EMAIL: admin@example.com
    LOCAL_PROJECT_PATH: ${LOCAL_PROJECT_PATH:-}
    SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
    SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
    SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
    SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-}
    SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-}
    SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-}
    SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-HITESH}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs/airflow:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - /var/run/docker.sock:/var/run/docker.sock
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - f1_net
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    networks:
      - f1_net

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create               --username "$${_AIRFLOW_WWW_USER_USERNAME}"               --password "$${_AIRFLOW_WWW_USER_PASSWORD}"               --firstname "$${_AIRFLOW_WWW_USER_FIRSTNAME}"               --lastname "$${_AIRFLOW_WWW_USER_LASTNAME}"               --role Admin               --email "$${_AIRFLOW_WWW_USER_EMAIL}" || true
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    container_name: f1-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - f1_net

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      for topic in topic_0 topic_1 topic_2 topic_3; do
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic $$topic --partitions 1 --replication-factor 1
      done
      kafka-topics --bootstrap-server kafka:29092 --list
    networks:
      - f1_net
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: f1-local-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - f1_net

  singlestore:
    image: ghcr.io/singlestore-labs/singlestoredb-dev:latest
    container_name: f1-singlestore
    environment:
      ROOT_PASSWORD: ${SINGLESTORE_ROOT_PASSWORD:-rootpass}
    ports:
      - "3306:3306"
      - "8081:8080"
      - "9000:9000"
    volumes:
      - singlestore-data:/data
    healthcheck:
      test: ["CMD-SHELL", "singlestore -uroot -p$${ROOT_PASSWORD} -e 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks:
      - f1_net

  singlestore-init:
    image: mysql:8.4
    env_file:
      - .env
    depends_on:
      singlestore:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./singlestore/init.sql:/init.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command: |
      echo "Initializing SingleStore realtime schema and native Kafka pipelines..."
      until mysql -h singlestore -P 3306 -uroot -p$${SINGLESTORE_ROOT_PASSWORD:-rootpass} -e "SELECT 1"; do sleep 2; done
      mysql -h singlestore -P 3306 -uroot -p$${SINGLESTORE_ROOT_PASSWORD:-rootpass} < /init.sql
      echo "SingleStore initialization finished."
    networks:
      - f1_net
    restart: "no"

  grafana:
    image: grafana/grafana:11.6.8
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: light
      SINGLESTORE_ROOT_PASSWORD: ${SINGLESTORE_ROOT_PASSWORD:-rootpass}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      singlestore-init:
        condition: service_completed_successfully
    networks:
      - f1_net

  realtime-api:
    build:
      context: ./docker/realtime
    image: f1-realtime-api:local
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PRODUCER_SCRIPT: /app/realtime/kafka_producer_v6_cloud.py
      GRAFANA_BASE_URL: http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      - ./include/hitesh/realtime_scripts:/app/realtime:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      singlestore-init:
        condition: service_completed_successfully
    networks:
      - f1_net

  f1-etl-image:
    build:
      context: ./docker/etl
    image: f1-python-etl:local
    profiles: ["images"]
    command: ["python", "--version"]
    networks:
      - f1_net

  f1-dbt-snowflake-image:
    build:
      context: ./docker/dbt
    image: f1-dbt-snowflake:local
    profiles: ["images"]
    command: ["dbt", "--version"]
    networks:
      - f1_net

volumes:
  postgres-db-volume:
  singlestore-data:
  grafana-data:

networks:
  f1_net:
    name: f1_net
    driver: bridge
