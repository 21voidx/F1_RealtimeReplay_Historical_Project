---
services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_COMPRESSION_TYPE: lz4
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - f1_net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server 127.0.0.1:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - f1_net
    entrypoint: /bin/bash
    command:
      - -c
      - |
        for topic in topic_0 topic_1 topic_2 topic_3; do
          kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic $$topic --partitions 1 --replication-factor 1
        done
        kafka-topics --bootstrap-server kafka:29092 --list

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: cdc-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: cdc-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://host.docker.internal:8083
      DYNAMIC_CONFIG_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8085:8080"
    networks:
      - f1_net

  singlestore:
    image: ghcr.io/singlestore-labs/singlestoredb-dev:latest
    container_name: singlestore
    environment:
      ROOT_PASSWORD: ${SINGLESTORE_ROOT_PASSWORD:-rootpass}
    ports:
      - "3308:3306"
      - "8081:8080"
      - "9000:9000"
    volumes:
      - singlestore-data:/data
    healthcheck:
      test: ["CMD-SHELL", "singlestore -uroot -p$${ROOT_PASSWORD} -e 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks:
      - f1_net

  singlestore-init:
    image: mysql:8-debian
    env_file:
      - .env
    depends_on:
      singlestore:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./singlestore/init.sql:/init.sql:ro
    networks:
      - f1_net
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Initializing SingleStore realtime schema and native Kafka pipelines..."
        until mysql -h singlestore -P 3306 -uroot -p$${SINGLESTORE_ROOT_PASSWORD:-rootpass} -e "SELECT 1"; do sleep 2; done
        mysql -h singlestore -P 3306 -uroot -p$${SINGLESTORE_ROOT_PASSWORD:-rootpass} < /init.sql
        echo "SingleStore initialization finished."

  grafana:
    image: grafana/grafana:11.6.8
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: dark
      SINGLESTORE_ROOT_PASSWORD: ${SINGLESTORE_ROOT_PASSWORD:-rootpass}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      singlestore-init:
        condition: service_completed_successfully
    networks:
      - f1_net

  # realtime-api:
  #   build:
  #     context: ./docker/realtime
  #   image: f1-realtime-api:local
  #   env_file:
  #     - .env
  #   environment:
  #     KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  #     PRODUCER_SCRIPT: /app/realtime/kafka_producer_v6_cloud.py
  #     GRAFANA_BASE_URL: http://localhost:3000
  #   ports:
  #     - "5000:5000"
  #   volumes:
  #     - ./include/hitesh/realtime_scripts:/app/realtime:ro
  #   depends_on:
  #     kafka-init:
  #       condition: service_completed_successfully
  #     singlestore-init:
  #       condition: service_completed_successfully
  #   networks:
  #     - f1_net

networks:
  f1_net:
    # driver: bridge
    external: true

volumes:
  kafka-data:
  singlestore-data:
  grafana-data:
